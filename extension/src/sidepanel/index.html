<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autodiscography Vault</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Autodiscography Vault · Phase A</p>
      <h1>Preservation floor</h1>
      <p class="boundary">SYNTHETIC ONLY — no live Suno network access; no cookies/session capture.</p>
    </header>

    <section aria-labelledby="proposal-heading">
      <h2 id="proposal-heading">Synthetic acquisition proposal</h2>
      <div id="tracks" aria-live="polite"></div>
    </section>

    <section class="gate" aria-labelledby="gate-heading">
      <h2 id="gate-heading">Live pilot</h2>
      <p>The provider adapter remains fixture-backed until the Phase-A receipt passes.</p>
      <button type="button" disabled>Locked until Phase-A receipt passes</button>
    </section>
  </main>
  <script type="module" src="./index.js"></script>
</body>
</html>
